    <title>PASAE @ Berkeley</title>
    <meta name="description" content="PASAE is UC Berkeley's Pilipinx Association of Scientists, Architects, and Engineers — a home for Filipinx students in STEM since 1988." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var stored = localStorage.getItem('pasae-theme')
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

  </body>
